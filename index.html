<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الأرباح سواسوة</title>
    <script src="https://pl29371532.profitablecpmratenetwork.com/0f/e1/b4/0fe1b4569297dd06a37c9414ad72bfff.js"></script>
    
    <style>
        body { background-color: #1a1a1a; color: white; font-family: Arial, sans-serif; text-align: center; margin: 0; padding: 0; }
        #ad-box { width: 90%; max-width: 400px; background: white; color: black; margin: 50px auto; padding: 20px; border-radius: 15px; }
        #timer { font-size: 40px; color: red; font-weight: bold; }
        .btn { display: none; background: green; color: white; padding: 15px; text-decoration: none; border-radius: 10px; margin-top: 20px; }
    </style>
</head>
<body>

    <h1>مرحباً بك في عالم الأرباح سواسوة</h1>
    <p>انتظر قليلاً حتى تظهر أفضل العروض لك سواسوة.</p>

    <div id="ad-box">
        <p>جاري تجهيز الإعلان الغالي...</p>
        <div id="timer">10</div>
        <script src="https://pl29371533.profitablecpmratenetwork.com/28/44/08/284408b6df19f3fa4d7f0d141c49bcdd.js"></script>
    </div>

    <a href="#" class="btn" id="claim-btn">اضغط هنا لاستلام أرباحك سواسوة</a>

    <script>
        var timeLeft = 10;
        var timerElement = document.getElementById('timer');
        var btnElement = document.getElementById('claim-btn');

        var countdown = setInterval(function() {
            timeLeft--;
            timerElement.textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdown);
                timerElement.textContent = "جاهز!";
                btnElement.style.display = 'block'; // يظهر الزر بعد 10 ثواني سواسوة
            }
        }, 1000);
    </script>

</body>
</html>
